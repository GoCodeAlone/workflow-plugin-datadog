name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./... -v -race -count=1

  strict-contracts:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Check plugin.json exists
        run: |
          test -f plugin.json || (echo "ERROR: plugin.json is missing" && exit 1)
      - name: Validate strict plugin contracts
        run: |
          GOPRIVATE=github.com/GoCodeAlone/* go run github.com/GoCodeAlone/workflow/cmd/wfctl@v0.77.0 audit plugins --strict-contracts --repo-root .
